<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f8f7f2"><title>분수 탐험대 — 칸으로 배우는 분수 곱셈</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap');
:root{--ink:#203128;--muted:#66746d;--paper:#f8f7f2;--green:#3e8968;--mint:#d9f1e5;--orange:#f2a65a;--line:#e6e6dc;--white:#fffefa;--shadow:0 16px 40px #30493712}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 8% 8%,#e5f4e9 0,transparent 32%),radial-gradient(ellipse at 95% 20%,#fff0dc 0,transparent 28%),var(--paper);color:var(--ink);font-family:'Gowun Dodum',sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.wrap{width:min(1080px,calc(100% - 36px));margin:auto;padding:26px 0 48px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.brand{font:24px Jua;color:var(--green);display:flex;gap:10px;align-items:center}.brand-mark{width:38px;height:38px;display:grid;place-items:center;background:var(--green);border-radius:13px;color:white;font-size:22px}.level{background:#fffefa;border:1px solid var(--line);padding:9px 14px;border-radius:99px;font-size:14px;color:var(--muted)}.hero{text-align:center;margin:0 auto 28px}.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--green);font-weight:bold}.hero h1{font:clamp(34px,6vw,54px) Jua;margin:9px 0 8px;letter-spacing:-.03em}.hero p{margin:0;color:var(--muted);font-size:16px}.layout{display:grid;grid-template-columns:1.05fr .95fr;gap:20px;align-items:stretch}.card{background:var(--white);border:1px solid #e9e9df;border-radius:24px;box-shadow:var(--shadow)}.visual{padding:24px 28px 22px;display:flex;flex-direction:column}.visual-head{display:flex;justify-content:space-between;align-items:center}.visual-head h2,.solve h2{font:22px Jua;margin:0}.hint-tag{font-size:12px;color:var(--green);background:#eaf5ee;padding:7px 11px;border-radius:99px}.equation{display:flex;align-items:center;justify-content:center;gap:20px;margin:23px 0 20px;font:28px Jua}.frac{display:inline-grid;grid-template-rows:auto 2px auto;text-align:center;min-width:36px;vertical-align:middle}.frac i{height:2px;background:currentColor;margin:3px 0}.times{color:#99a49c;font-size:24px}.board-wrap{display:grid;grid-template-columns:42px minmax(0,1fr);grid-template-rows:clamp(190px,70vw,340px) 28px;gap:4px 10px;align-items:center;margin:auto;width:min(100%,430px)}.row-labels{display:flex;flex-direction:column;justify-content:space-around;height:100%;color:#65746b;font-size:13px;text-align:right}.grid{display:grid;gap:5px;width:100%;height:100%;aspect-ratio:auto}.cell{border:1.5px solid #d7ded7;border-radius:7px;background:#fff;transition:transform .18s,background .25s,border .2s;min-width:0}.cell.first{background:#bde6d0;border-color:#99ceb0}.cell.overlap{background:var(--green);border-color:var(--green);box-shadow:inset 0 0 0 2px #ffffff22;animation:pop .35s ease both}.col-labels{display:flex;justify-content:space-around;color:#65746b;font-size:13px}.axis-caption{font-size:12px;color:#89948d}.legend{display:flex;justify-content:center;gap:18px;margin-top:16px;color:#65746b;font-size:13px}.legend span{display:flex;align-items:center;gap:7px}.swatch{width:13px;height:13px;border-radius:4px;border:1px solid #ccd5cd}.swatch.a{background:#bde6d0}.swatch.b{background:#f2c890}.swatch.x{background:var(--green)}.explain{margin:19px 0 0;padding:13px 15px;background:#f5f7f0;border-radius:14px;font-size:14px;line-height:1.55;color:#58665d}.solve{padding:25px 26px;display:flex;flex-direction:column}.step{font-size:12px;color:#89948d;letter-spacing:.08em;font-weight:bold}.solve h2{margin:5px 0 6px;font-size:24px}.solve .sub{margin:0 0 22px;color:var(--muted);font-size:14px}.problem{display:flex;justify-content:center;align-items:center;gap:14px;padding:16px;background:#f8f8f2;border-radius:16px;font:26px Jua;margin-bottom:22px}.answer-label{font-size:14px;color:#65746b;margin-bottom:9px}.answer-row{display:flex;align-items:center;justify-content:center;gap:12px}.answer-frac{display:grid;grid-template-rows:44px 2px 44px;width:74px;text-align:center}.answer-frac input{width:100%;border:1.5px solid var(--line);border-radius:12px;background:#fff;text-align:center;font:22px Jua;color:var(--ink);outline:none}.answer-frac input:focus{border-color:var(--green);box-shadow:0 0 0 3px #3e89681d}.answer-frac i{background:#8a978d;margin:4px 7px}.equals{font-size:24px;color:#a2aaa4}.actions{display:flex;gap:10px;margin-top:17px}.primary,.secondary{border:0;border-radius:13px;padding:13px 16px;font-weight:bold;transition:transform .15s,filter .15s}.primary{background:var(--green);color:white;flex:1;box-shadow:0 5px 12px #3e89682b}.secondary{background:#edf2eb;color:#526257}.primary:hover,.secondary:hover{transform:translateY(-1px);filter:brightness(1.03)}.feedback{min-height:50px;margin-top:16px;padding:12px 14px;border-radius:14px;font-size:14px;line-height:1.45;color:transparent;background:transparent}.feedback.show{color:#4d6656;background:#f2f7ee}.feedback.good{color:#236347;background:#e5f5eb}.feedback.bad{color:#946023;background:#fff4df}.scoreline{display:flex;justify-content:space-between;margin-top:auto;padding-top:20px;border-top:1px solid var(--line);font-size:13px;color:#77837a}.scoreline strong{color:var(--green);font:18px Jua}.tip{margin-top:16px;font-size:12px;color:#929c94;text-align:center}.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}@keyframes pop{0%{transform:scale(.82)}70%{transform:scale(1.06)}100%{transform:scale(1)}}
@media(max-width:740px){.wrap{width:min(100% - 24px,540px);padding-top:16px}.top{margin-bottom:22px}.brand{font-size:20px}.hero{margin-bottom:20px}.hero p{font-size:14px}.layout{grid-template-columns:1fr;gap:14px}.visual{padding:20px}.solve{padding:22px}.grid{max-width:340px;margin:auto;width:100%}.board-wrap{max-width:390px}.scoreline{margin-top:12px}}
</style>
</head>
<body>
<main class="wrap">
<header class="top"><div class="brand"><span class="brand-mark">▦</span>분수 탐험대</div><div class="level" id="level">🌱 첫걸음 · 1단계</div></header>
<section class="hero"><div class="eyebrow">칸을 색칠하며 발견하는 수학</div><h1>분수의 곱셈 게임</h1><p>두 분수가 겹치는 칸을 세어 보세요!</p></section>
<section class="layout">
<article class="card visual"><div class="visual-head"><h2>색칠 그림</h2><span class="hint-tag">겹친 칸 = 곱한 만큼</span></div>
<div class="equation" id="visualEquation"></div>
<div class="board-wrap"><div class="row-labels" id="rowLabels"></div><div class="grid" id="grid" role="img" aria-label="두 분수의 곱을 나타낸 칸 그림"></div><div class="axis-caption">두 번째 분수</div><div class="col-labels" id="colLabels"></div></div>
<div class="legend"><span><i class="swatch a"></i>첫 번째 분수</span><span><i class="swatch b"></i>두 번째 분수</span><span><i class="swatch x"></i>겹친 부분</span></div>
<div class="explain" id="explanation">연한 초록 칸은 첫 번째 분수, 주황 칸은 두 번째 분수예요. 진한 초록색 겹친 칸이 곱셈의 답이에요.</div></article>
<article class="card solve"><div class="step">MISSION <span id="round">01</span></div><h2>겹친 칸은 전체의 얼마일까요?</h2><p class="sub">전체 칸 수와 진한 초록 칸 수를 세어 답을 써 보세요.</p><div class="problem" id="problem"></div>
<label class="answer-label" for="num">답을 분수로 입력해 주세요</label><div class="answer-row"><div class="answer-frac"><input id="num" inputmode="numeric" type="number" min="0" aria-label="분자"><i></i><input id="den" inputmode="numeric" type="number" min="1" aria-label="분모"></div><span class="equals">=</span><span class="frac" id="answerPreview"><b>?</b><i></i><b>?</b></span></div>
<div class="actions"><button class="primary" id="check">정답 확인하기 <span aria-hidden="true">→</span></button><button class="secondary" id="next">새 문제</button></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="scoreline"><span>맞힌 문제</span><strong><span id="score">0</span>개</strong><span id="streak">🔥 연속 0</span></div><div class="tip">분수는 약분해서 써도 되고, 약분하지 않아도 괜찮아요.</div></article>
</section></main>
<script>
const $=s=>document.querySelector(s);let question,score=0,streak=0,round=0,solved=false;
const gcd=(a,b)=>b?gcd(b,a%b):a;
function fraction(n,d){return `<span class="frac"><b>${n}</b><i></i><b>${d}</b></span>`}
function makeQuestion(){const max=score<3?4:6;let a,b,c,d;do{b=2+Math.floor(Math.random()*(max-1));d=2+Math.floor(Math.random()*(max-1));a=1+Math.floor(Math.random()*(b-1));c=1+Math.floor(Math.random()*(d-1));}while((b*d>24)|| (question&&a===question.a&&b===question.b&&c===question.c&&d===question.d));question={a,b,c,d};solved=false;round++;render();$('#feedback').className='feedback';$('#feedback').textContent='';$('#num').value='';$('#den').value='';$('#num').focus();}
function render(){const{a,b,c,d}=question;$('#problem').innerHTML=`${fraction(a,b)} <span class="times">×</span> ${fraction(c,d)}`;$('#visualEquation').innerHTML=`${fraction(a,b)} <span class="times">×</span> ${fraction(c,d)} <span class="times">=</span> ?`;
const g=$('#grid');g.style.gridTemplateColumns=`repeat(${b},1fr)`;g.style.gridTemplateRows=`repeat(${d},1fr)`;g.innerHTML='';for(let r=0;r<d;r++)for(let col=0;col<b;col++){let cell=document.createElement('div');cell.className='cell';if(col<a)cell.classList.add('first');if(r<c){if(col<a)cell.className='cell overlap';else cell.style.background='#f2c890';cell.style.borderColor=col<a?'#3e8968':'#e4b77d';}g.appendChild(cell)}
$('#rowLabels').innerHTML=Array.from({length:d},(_,i)=>`<span>${i<c?'●':'○'}</span>`).join('');$('#rowLabels').style.height='';$('#colLabels').innerHTML=Array.from({length:b},(_,i)=>`<span>${i<a?'●':'○'}</span>`).join('');$('#round').textContent=String(round).padStart(2,'0');$('#level').textContent=score<3?'🌱 첫걸음 · 1단계':score<7?'🌿 탐험 중 · 2단계':'🌳 분수 달인 · 3단계';$('#score').textContent=score;$('#streak').textContent=`🔥 연속 ${streak}`;$('#answerPreview').innerHTML=`<b>${$('#num').value||'?'}</b><i></i><b>${$('#den').value||'?'}</b>`;
$('#explanation').innerHTML=`전체 <b>${b} × ${d} = ${b*d}칸</b> 중에서, 첫 번째 색과 두 번째 색이 겹치는 칸은 <b>${a} × ${c} = ${a*c}칸</b>이에요.`;}
function check(){if(solved){makeQuestion();return}const n=Number($('#num').value),d=Number($('#den').value),ansN=question.a*question.c,ansD=question.b*question.d,f=$('#feedback');if(!$('#num').value||!$('#den').value||d<=0){f.className='feedback show bad';f.textContent='분자와 분모를 모두 입력해 주세요.';return}if(n*ansD===d*ansN){score++;streak++;solved=true;f.className='feedback show good';f.textContent=`정답이에요! ${question.a}×${question.c}=${ansN}칸, 전체 ${question.b}×${question.d}=${ansD}칸이므로 ${ansN}/${ansD}예요. ${gcd(ansN,ansD)>1?`약분하면 ${ansN/gcd(ansN,ansD)}/${ansD/gcd(ansN,ansD)}!`:''}`;$('#check').innerHTML='다음 문제 <span aria-hidden="true">→</span>';$('#score').textContent=score;$('#streak').textContent=`🔥 연속 ${streak}`;$('#level').textContent=score<3?'🌱 첫걸음 · 1단계':score<7?'🌿 탐험 중 · 2단계':'🌳 분수 달인 · 3단계';}else{streak=0;f.className='feedback show bad';f.textContent='다시 세어 볼까요? 진한 초록 칸은 분자, 전체 칸은 분모예요.';$('#streak').textContent=`🔥 연속 ${streak}`}}
$('#num').addEventListener('input',()=>$('#answerPreview').innerHTML=`<b>${$('#num').value||'?'}</b><i></i><b>${$('#den').value||'?'}</b>`);$('#den').addEventListener('input',()=>$('#answerPreview').innerHTML=`<b>${$('#num').value||'?'}</b><i></i><b>${$('#den').value||'?'}</b>`);$('#check').addEventListener('click',check);$('#next').addEventListener('click',makeQuestion);document.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();check()}});makeQuestion();
</script>
</body></html>
